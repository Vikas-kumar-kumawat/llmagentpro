<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16436a"/>
      <stop offset="30%" stop-color="#256499"/>
      <stop offset="60%" stop-color="#4697cf"/>
      <stop offset="85%" stop-color="#73c7e0"/>
      <stop offset="100%" stop-color="#a0e3f0"/>
    </linearGradient>
    
    <linearGradient id="waveHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="40%" stop-color="rgba(160, 227, 240, 0.3)"/>
      <stop offset="80%" stop-color="rgba(70, 151, 207, 0.1)"/>
      <stop offset="100%" stop-color="rgba(22, 67, 106, 0)"/>
    </linearGradient>

    <linearGradient id="waveDeep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 45, 75, 0.6)"/>
      <stop offset="50%" stop-color="rgba(37, 100, 153, 0.3)"/>
      <stop offset="100%" stop-color="rgba(160, 227, 240, 0)"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
    
    <filter id="subtleBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <!-- Base Gradient matching user light theme wallpaper -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Glowing cyan/sky ambient beams -->
  <ellipse cx="1250" cy="180" rx="650" ry="450" fill="#a4e9f7" opacity="0.5" filter="url(#softGlow)" />
  <ellipse cx="900" cy="400" rx="550" ry="320" fill="#69cbe3" opacity="0.4" filter="url(#softGlow)" />
  <ellipse cx="300" cy="800" rx="600" ry="400" fill="#123759" opacity="0.85" filter="url(#softGlow)" />

  <!-- Smooth silk wave curves across the canvas -->
  <path d="M-100,550 Q350,750 850,420 T1540,150 L1540,-100 L-100,-100 Z" fill="url(#waveHighlight)" filter="url(#subtleBlur)"/>
  <path d="M-100,680 C300,900 800,550 1540,320 L1540,-100 L-100,-100 Z" fill="rgba(255, 255, 255, 0.15)"/>
  <path d="M-100,820 Q450,980 950,650 T1540,480 L1540,1000 L-100,1000 Z" fill="url(#waveDeep)"/>
</svg>
